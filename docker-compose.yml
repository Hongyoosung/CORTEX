
services:
  # =============================================================================
  # TRAINING SERVICES (Commander-Executor Architecture)
  # =============================================================================

  # Phase 1: Policy Training (Command-Driven Executors)
  training:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_training
    volumes:
      - ./DE_Training/training_results:/app/training_results
      - ./DE_Training/models:/app/models
    environment:
      # Passed through from the host shell (or training.bat).
      # Use the default values shown here when not set by the launcher.
      - NUM_SCHOLA_ENVS=${NUM_SCHOLA_ENVS:-4}   # UE5 Schola env count
      - NUM_WORKERS=${NUM_WORKERS:-0}             # Ray RLlib env-runners (0 = local)
      - NUM_ITERATIONS=${NUM_ITERATIONS:-100}     # Training iterations
      - HOST=host.docker.internal                 # Connect to UE5 on host machine
      - PORT=50051
      - IS_DOCKER=true                            # Enable Docker-specific gRPC settings
      - RESUME_CHECKPOINT=${RESUME_CHECKPOINT:-}  # Optional: path to checkpoint to resume from
      - USE_SELF_ATTN=${USE_SELF_ATTN:-1}          # Ablation: 0=disable Self-Attention
      # Individual-respawn guard: seconds to wait after send_reset_msg() before
      # sending the first action.  Prevents GymConnector timeout when agents
      # spawn at different times (individual respawn mode).  Increase if UE5
      # still times out; set to 0 to disable (full-team-wipe spawning only).
      - POST_RESET_DELAY=${POST_RESET_DELAY:-4.0}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # $$VAR is expanded by the container shell (not by Compose),
    # so the value comes from the environment section above.
    command: >-
      sh -c "python training/train.py
      --mode rllib
      --iterations $$NUM_ITERATIONS
      --host host.docker.internal
      --port 50051"
    profiles:
      - policy


  # =============================================================================
  # EVALUATION SERVICE
  # =============================================================================

  # Live evaluation: best vs latest checkpoint head-to-head against ScriptedAI
  # Requires UE5 running with exactly 2 environments (bUseScriptedOpponent=true)
  eval:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_eval
    volumes:
      - ./DE_Training/training_results:/app/training_results
    environment:
      - CHECKPOINT_BEST=${CHECKPOINT_BEST}
      - CHECKPOINT_LATEST=${CHECKPOINT_LATEST}
      - EVAL_EPISODES=${EVAL_EPISODES:-50}
      - HOST=host.docker.internal
      - PORT=50051
      - POST_RESET_DELAY=${POST_RESET_DELAY:-4.0}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >-
      sh -c "python training/eval_live.py
      --checkpoint-best $$CHECKPOINT_BEST
      --checkpoint-latest $$CHECKPOINT_LATEST
      --episodes $$EVAL_EPISODES
      --host host.docker.internal
      --port 50051"
    profiles:
      - eval


  # =============================================================================
  # MONITORING SERVICES
  # =============================================================================

  # TensorBoard for training
  tensorboard:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_tensorboard
    volumes:
      - ./DE_Training/training_results:/app/training_results
    ports:
      - "6006:6006"
    command: tensorboard --logdir=/app/training_results --host=0.0.0.0
    profiles:
      - monitor


  # =============================================================================
  # DIAGNOSTIC SERVICES
  # =============================================================================

  # Connection diagnostics (TCP)
  test-connection:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_connection_test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python test_connection.py
    profiles:
      - test

  # Connection diagnostics (gRPC)
  test-grpc:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_grpc_test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python test_grpc_connection.py
    profiles:
      - test

  # Timeout diagnostics (DEADLINE_EXCEEDED errors)
  diagnose-timeout:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_timeout_diag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python diagnose_timeout.py
    profiles:
      - test

  # Training failure diagnostics (why training fails but connection succeeds)
  diagnose-training:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_training_diag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python diagnose_training_failure.py
    profiles:
      - test

  # Agent registration diagnostics (check multi-environment agent distribution)
  diagnose-agents:
    build:
      context: .
      dockerfile: DE_Training/Dockerfile
    container_name: DE_agent_diag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python diagnose_agent_registration.py
    profiles:
      - test
