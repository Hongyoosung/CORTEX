# MOC v10.2 — Ray Cluster Configuration
# Head:    1x g4dn.xlarge  (On-demand, GPU for policy inference)
# Workers: 4x c5.2xlarge   (Spot, CPU rollout workers)
#
# Usage:
#   ray up aws/cluster.yaml
#   ray submit aws/cluster.yaml train_rllib.py -- --config aws/rllib_config.py
#   ray down aws/cluster.yaml -y

cluster_name: cortex-moc-v10-2

# Maximum number of workers (excludes head)
max_workers: 4

# Autoscaler — scale up/down based on resource demand
upscaling_speed: 1.0
idle_timeout_minutes: 10

# Docker image used on all nodes
docker:
  image: "your-ecr-account.dkr.ecr.us-east-1.amazonaws.com/cortex-moc:v10-2-latest"
  container_name: "ray_container"
  pull_before_run: true
  run_options:
    - "--shm-size=4g"      # Large shared memory for Ray object store
    - "--ulimit nofile=65536:65536"

provider:
  type: aws
  region: us-east-1
  availability_zone: us-east-1a
  # Reuse the VPC/subnets created by Terraform — fill in actual IDs after `terraform apply`
  subnet_id: subnet-REPLACE_WITH_PUBLIC_SUBNET_ID     # public subnet for head
  security_group_ids:
    - sg-REPLACE_WITH_HEAD_SG_ID

  # Use the IAM instance profile so nodes can access S3 without static keys
  iam_instance_profile: cortex-moc-v10-2-dev-ray-node-profile

  cache_stopped_nodes: false   # Terminate on cluster down to avoid idle charges

auth:
  ssh_user: ubuntu
  ssh_private_key: ~/.ssh/id_rsa

###############################################################################
# Head Node — g4dn.xlarge (4 vCPU, 16 GB RAM, 1x T4 GPU, on-demand)
###############################################################################
head_node_type:
  node_config:
    InstanceType: g4dn.xlarge
    ImageId: ami-0c55b159cbfafe1f0   # Deep Learning AMI (Ubuntu 20.04) us-east-1
    KeyName: cortex-moc-v10-2-dev-key
    BlockDeviceMappings:
      - DeviceName: /dev/sda1
        Ebs:
          VolumeSize: 100    # GB — enough for Docker images + checkpoints
          VolumeType: gp3
          DeleteOnTermination: true
    TagSpecifications:
      - ResourceType: instance
        Tags:
          - Key: Name
            Value: cortex-moc-head
          - Key: Project
            Value: cortex-moc-v10-2

  resources:
    CPU: 4
    GPU: 1

###############################################################################
# Worker Nodes — c5.2xlarge Spot (8 vCPU, 16 GB RAM)
###############################################################################
available_node_types:
  cpu_worker:
    node_config:
      InstanceType: c5.2xlarge
      ImageId: ami-0c55b159cbfafe1f0
      KeyName: cortex-moc-v10-2-dev-key

      # Spot configuration — set max price to ~2x on-demand to avoid frequent interruption
      InstanceMarketOptions:
        MarketType: spot
        SpotOptions:
          SpotInstanceType: persistent
          InstanceInterruptionBehavior: stop
          MaxPrice: "0.40"   # USD/hr  (~2x on-demand ~$0.192)

      # Private subnet for workers (no public IP, egress via NAT)
      SubnetId: subnet-REPLACE_WITH_PRIVATE_SUBNET_ID
      SecurityGroupIds:
        - sg-REPLACE_WITH_WORKER_SG_ID

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            DeleteOnTermination: true

      TagSpecifications:
        - ResourceType: instance
          Tags:
            - Key: Name
              Value: cortex-moc-worker
            - Key: Project
              Value: cortex-moc-v10-2

    resources:
      CPU: 8

    min_workers: 0
    max_workers: 4

head_node: cpu_worker   # Override: head uses the gpu_head type above
# (ray ignores this field when head_node_type is set — kept for clarity)

###############################################################################
# File Mounts — sync local code to all nodes before startup
###############################################################################
file_mounts:
  "/home/ubuntu/cortex/MOC_Training": "./MOC_Training"

# Patterns to exclude from sync
rsync_exclude:
  - "**/__pycache__"
  - "**/*.pyc"
  - "**/training_results_v10_2"
  - "**/.git"

###############################################################################
# Initialisation Commands (run once on first boot)
###############################################################################
initialization_commands:
  # System packages
  - sudo apt-get update -q
  - sudo apt-get install -y -q awscli s3fs fuse

  # Mount S3 bucket via s3fs (IAM role — no credentials needed)
  - |
    BUCKET=$(aws s3api list-buckets --query "Buckets[?starts_with(Name,'cortex-moc-v10-2')].Name | [0]" --output text)
    sudo mkdir -p /mnt/s3-training
    echo "${BUCKET} /mnt/s3-training fuse.s3fs _netdev,allow_other,iam_role=auto,umask=0022 0 0" | sudo tee -a /etc/fstab
    sudo mount -a || true
    echo "S3 bucket mounted at /mnt/s3-training (bucket=${BUCKET})"

  # Create local checkpoint symlink pointing to S3 mount
  - mkdir -p /home/ubuntu/cortex/checkpoints
  - ln -sfn /mnt/s3-training/checkpoints /home/ubuntu/cortex/checkpoints/s3 || true

###############################################################################
# Setup Commands (run on every restart, inside Docker container)
###############################################################################
setup_commands:
  # Sync any new code changes from S3 (useful after hot-patching)
  - |
    aws s3 sync s3://$(aws s3api list-buckets \
      --query "Buckets[?starts_with(Name,'cortex-moc-v10-2')].Name | [0]" \
      --output text)/code/ /home/ubuntu/cortex/ --exclude "*.pyc" || true

###############################################################################
# Head Start Commands
###############################################################################
head_start_ray_commands:
  - ray stop || true
  - >
    ray start
    --head
    --port=6379
    --ray-client-server-port=10001
    --object-manager-port=8076
    --node-manager-port=8077
    --dashboard-host=0.0.0.0
    --dashboard-port=8265
    --num-cpus=4
    --num-gpus=1
    --block

###############################################################################
# Worker Start Commands
###############################################################################
worker_start_ray_commands:
  - ray stop || true
  - >
    ray start
    --address=$RAY_HEAD_IP:6379
    --num-cpus=8
    --num-gpus=0
    --block
