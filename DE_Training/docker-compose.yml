
services:
  # =============================================================================
  # v10.2 TRAINING SERVICES (Commander-Executor Architecture)
  # =============================================================================

  # v10.2 Phase 1: Policy Training (Command-Driven Executors)
  training-v10.2:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_training_v10_2
    volumes:
      - ./training_results_v10_2:/app/training_results_v10_2
      - ./models:/app/models
    environment:
      # Passed through from the host shell (or training.bat).
      # Use the default values shown here when not set by the launcher.
      - NUM_SCHOLA_ENVS=${NUM_SCHOLA_ENVS:-4}   # UE5 Schola env count
      - NUM_WORKERS=${NUM_WORKERS:-0}             # Ray RLlib env-runners (0 = local)
      - NUM_ITERATIONS=${NUM_ITERATIONS:-100}     # Training iterations
      - HOST=host.docker.internal                 # Connect to UE5 on host machine
      - PORT=50051
      - IS_DOCKER=true                            # Enable Docker-specific gRPC settings
      - RESUME_CHECKPOINT=${RESUME_CHECKPOINT:-}  # Optional: path to checkpoint to resume from
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # $$VAR is expanded by the container shell (not by Compose),
    # so the value comes from the environment section above.
    command: >-
      sh -c "python training/policy_training.py
      --mode rllib
      --iterations $$NUM_ITERATIONS
      --host host.docker.internal
      --port 50051"
    profiles:
      - v10.2
      - v10.2-policy

  # v10.2 Example Mode (Architecture Demo)
  training-v10.2-example:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_training_v10_2_example
    command: python training/policy_training.py --mode example
    profiles:
      - v10.2-demo



  # =============================================================================
  # MONITORING SERVICES
  # =============================================================================

  # TensorBoard for v10.2 training
  tensorboard-v10.2:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_tensorboard_v10_2
    volumes:
      - ./training_results_v10_2:/app/training_results_v10_2
    ports:
      - "6006:6006"
    command: tensorboard --logdir=/app/training_results_v10_2 --host=0.0.0.0
    profiles:
      - v10.2
      - monitor

  # TensorBoard for legacy training
  tensorboard:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_tensorboard
    volumes:
      - ./training_results:/app/training_results
    ports:
      - "6007:6006"  # Use different port to avoid conflict with v10.2
    command: tensorboard --logdir=/app/training_results --host=0.0.0.0
    profiles:
      - legacy
      - monitor

  # =============================================================================
  # DIAGNOSTIC SERVICES
  # =============================================================================

  # Connection diagnostics (TCP)
  test-connection:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_connection_test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python test_connection.py
    profiles:
      - test

  # Connection diagnostics (gRPC)
  test-grpc:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_grpc_test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python test_grpc_connection.py
    profiles:
      - test

  # Timeout diagnostics (DEADLINE_EXCEEDED errors)
  diagnose-timeout:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_timeout_diag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python diagnose_timeout.py
    profiles:
      - test

  # Training failure diagnostics (why training fails but connection succeeds)
  diagnose-training:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_training_diag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python diagnose_training_failure.py
    profiles:
      - test

  # Agent registration diagnostics (check multi-environment agent distribution)
  diagnose-agents:
    build:
      context: ..
      dockerfile: DE_Training/Dockerfile
    container_name: DE_agent_diag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=host.docker.internal
      - PORT=50051
    command: python diagnose_agent_registration.py
    profiles:
      - test
